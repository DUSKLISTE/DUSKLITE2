name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      ANDROID_CMAKE_VERSION: "3.31.6"
      JAVA_VERSION: "17"
      RUST_ANDROID_TARGET: "aarch64-linux-android"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          git submodule status --recursive

          if [ ! -d extern/aurora ]; then
            echo "ERRO: extern/aurora não existe. Verifique se o submódulo Aurora foi configurado corretamente."
            exit 1
          fi

          if [ -z "$(ls -A extern/aurora)" ]; then
            echo "ERRO: extern/aurora está vazio. Verifique submódulos."
            exit 1
          fi

          echo "Aurora submodule:"
          git -C extern/aurora rev-parse --short HEAD
          ls -la extern/aurora

      - name: Install Ubuntu dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            build-essential \
            pkg-config \
            python3 \
            python3-pip \
            git \
            zip \
            unzip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.1.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Rust Android target
        run: |
          set -euo pipefail
          rustup toolchain install stable
          rustup target add "${RUST_ANDROID_TARGET}"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnostics
        run: |
          set -euo pipefail
          java -version
          cmake --version
          ninja --version
          rustc --version
          cargo --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          sdkmanager --list | head -n 80 || true
          ls -la
          ls -la platforms/android || true
          ls -la platforms/android/scripts || true
          ls -la extern || true
          ls -la extern/aurora || true

      - name: Configure Android arm64
        run: |
          set -euo pipefail
          cmake --preset android-arm64 \
            -DRust_CARGO_TARGET="${RUST_ANDROID_TARGET}" \
            -DDUSK_ENABLE_SENTRY_NATIVE=OFF

      - name: Build native Android arm64
        run: |
          set -euo pipefail
          cmake --build --preset android-arm64 --parallel

      - name: Stage JNI libraries
        run: |
          set -euo pipefail

          if [ -f platforms/android/scripts/stage-jni-libs.sh ]; then
            chmod +x platforms/android/scripts/stage-jni-libs.sh
            ANDROID_STAGE_ABIS="arm64-v8a" ./platforms/android/scripts/stage-jni-libs.sh
          else
            echo "ERRO: platforms/android/scripts/stage-jni-libs.sh não encontrado."
            echo "Arquivos com nome stage-jni-libs.sh encontrados:"
            find . -name "stage-jni-libs.sh" -print
            exit 1
          fi

      - name: Build APK with Gradle
        working-directory: platforms/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist

          APK_PATH=""
          for candidate in \
            "platforms/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" \
            "platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          do
            if [ -f "$candidate" ]; then
              APK_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APK_PATH" ]; then
            echo "ERRO: APK Android arm64 debug não encontrado nos caminhos esperados."
            echo "APKs encontrados:"
            find platforms/android/app/build/outputs -name "*.apk" -print || true
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APK_NAME="DUSKLITE-${GITHUB_REF_NAME}-android-arm64-debug.apk"
          else
            SHORT_SHA="${GITHUB_SHA:0:12}"
            APK_NAME="DUSKLITE-${SHORT_SHA}-android-arm64-debug.apk"
          fi

          cp "$APK_PATH" "dist/$APK_NAME"
          echo "APK coletado: $APK_PATH -> dist/$APK_NAME"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUSKLITE-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
